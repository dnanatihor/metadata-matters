# Chat model and spend cap: docs/adr/0004-chat-model-and-budget.md.
# The two local sentence-transformers models are required for schema retrieval.
models:
  - id: gpt-4.1-mini
    kind: chat
    provider: openai
  - id: sentence-transformers/all-MiniLM-L6-v2
    kind: embedding
    provider: sentence-transformers
  - id: sentence-transformers/all-mpnet-base-v2
    kind: embedding
    provider: sentence-transformers
