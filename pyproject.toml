[project]
name = "metadata-matters"
version = "0.1.0"
description = "Benchmark how catalog metadata changes text-to-SQL accuracy and schema retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "ruff==0.16.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mm"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["mm"]
namespace_packages = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
